<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>拍摄调色</title>
<!-- 与调色模式同一套控件样式（controls.css），两边永远长一个样 -->
<link rel="stylesheet" href="controls.css">
<style>
/* 悬在取景上：背景完全透明，取景整块透上来（WebView 本身在原生侧也已设 TRANSPARENT）。
   没有纱衬底，对比度全靠原生按取景明暗把前景反色（setCameraTheme 深浅两套） */
html,body{height:auto}
body{
  background:transparent;
  min-height:0;
}
#wrap{padding:4px 18px 8px}
/* 拍摄页空间紧：读数和按钮各收一点，滑块结构不变 */
#readout{height:40px}
#val{font-size:26px}
#tabs .tab{height:50px}
#tail{display:flex;align-items:baseline;gap:14px}
#reset{font-size:12px;letter-spacing:.04em;color:var(--mut);padding:6px 2px;transition:color .15s}
#reset:active{color:var(--fg)}
@media (prefers-reduced-motion:reduce){#reset{transition:none}}
</style>
</head>
<body>

<div id="wrap">
  <div id="readout">
    <div id="who"><span id="letter">R</span><span id="cname">红</span></div>
    <div id="tail">
      <span id="val">100<i>%</i></span>
      <button id="reset" type="button">复位</button>
    </div>
  </div>

  <div id="track" role="slider" tabindex="0"
       aria-label="通道强度" aria-valuemin="0" aria-valuemax="200" aria-valuenow="100"
       aria-valuetext="100%">
    <div id="rail"></div>
    <div id="fill"></div>
    <div id="tick"></div>
    <div id="ticks"></div>
    <div id="knob"></div>
    <div id="ends"><span>0</span><span class="mid">100</span><span>200</span></div>
  </div>

  <div id="tabs">
    <button class="tab on" type="button" data-ch="r"><span class="l">R</span><span class="c">红</span></button>
    <button class="tab" type="button" data-ch="g"><span class="l">G</span><span class="c">绿</span></button>
    <button class="tab" type="button" data-ch="b"><span class="l">B</span><span class="c">蓝</span></button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CH = {
    r: { letter: 'R', name: '红', color: '#E5484D', soft: 'rgba(229,72,77,.14)' },
    g: { letter: 'G', name: '绿', color: '#2F9E44', soft: 'rgba(47,158,68,.14)' },
    b: { letter: 'B', name: '蓝', color: '#1F6FEB', soft: 'rgba(31,111,235,.14)' }
  };
  var v = { r: 100, g: 100, b: 100 };
  var cur = 'r';

  var $ = function (id) { return document.getElementById(id); };
  var letter = $('letter'), cname = $('cname'), val = $('val');
  var track = $('track'), fill = $('fill'), knob = $('knob');
  var tabs = [].slice.call(document.querySelectorAll('.tab'));

  function push() {
    if (window.Native) { Native.onValues(v.r, v.g, v.b); }
  }

  function sync() {
    var c = CH[cur];
    document.documentElement.style.setProperty('--ch', c.color);
    document.documentElement.style.setProperty('--ch-soft', c.soft);
    letter.textContent = c.letter;
    cname.textContent = c.name;
    val.innerHTML = v[cur] + '<i>%</i>';
    tabs.forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-ch') === cur);
    });
    var x = v[cur] / 2;                 // 0..200 → 0..100%
    knob.style.left = x + '%';
    fill.style.left = Math.min(50, x) + '%';
    fill.style.width = Math.abs(x - 50) + '%';
    track.setAttribute('aria-valuenow', v[cur]);
    track.setAttribute('aria-valuetext', v[cur] + '%');
  }

  function setChannel(ch) {
    if (ch === cur) { return; }
    cur = ch;
    sync();
    push();
    if (navigator.vibrate) { navigator.vibrate(8); }
  }

  function setValue(n) {
    // 5% 分度：吸附到最近的一格，只精确到每 5% 一格
    n = Math.max(0, Math.min(200, Math.round(n / 5) * 5));
    if (n === v[cur]) { return; }
    v[cur] = n;
    sync();
    push();
  }

  // 轨道下的短刻度：0..200 每 5 一根（中点那根由 #tick 主刻度标）
  (function buildTicks() {
    var box = document.getElementById('ticks');
    for (var i = 0; i <= 200; i += 5) {
      if (i === 100) { continue; }
      var t = document.createElement('i');
      t.style.left = (i / 2) + '%';
      box.appendChild(t);
    }
  })();
  function valueAt(clientX) {
    var r = track.getBoundingClientRect();
    return ((clientX - r.left) / r.width) * 200;
  }

  track.addEventListener('pointerdown', function (e) {
    track.setPointerCapture(e.pointerId);
    document.body.classList.add('dragging');
    track.focus();
    setValue(valueAt(e.clientX));
    e.preventDefault();
  });
  track.addEventListener('pointermove', function (e) {
    if (document.body.classList.contains('dragging')) {
      setValue(valueAt(e.clientX));
    }
  });
  ['pointerup', 'pointercancel'].forEach(function (t) {
    track.addEventListener(t, function () {
      document.body.classList.remove('dragging');
    });
  });
  track.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 25 : 5;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setValue(v[cur] - step); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setValue(v[cur] + step); }
    else if (e.key === 'Home') { setValue(0); }
    else if (e.key === 'End') { setValue(200); }
    else { return; }
    e.preventDefault();
  });

  tabs.forEach(function (t) {
    t.addEventListener('click', function () { setChannel(t.getAttribute('data-ch')); });
  });

  $('reset').addEventListener('click', function () {
    // 只复位当前通道：另外两个正在调的值不丢（边调边拍要留住）
    v[cur] = 100;
    sync();
    push();
  });

  // 原生按取景亮度切主题（深/浅两套前景+轨道+通道色）：取景亮 → 深底浅字，
  // 取景暗 → 浅底深字，通道色深底上提亮一档保对比。光标/滑块结构两边一样。
  var THEME = {
    light: {
      fg: '#141416', mut: '#6E6E76', faint: '#7A7A82', line: '#DCDCE1',
      tick: 'rgba(20,20,22,.45)', glow: 'rgba(20,20,22,.30)',
      ring: 'rgba(20,20,22,.18)',
      ch: {
        r: ['#E5484D', 'rgba(229,72,77,.14)'],
        g: ['#2F9E44', 'rgba(47,158,68,.14)'],
        b: ['#1F6FEB', 'rgba(31,111,235,.14)']
      }
    },
    dark: {
      fg: '#F4F4F6', mut: '#B6B6BE', faint: '#9C9CA4', line: '#55555E',
      tick: 'rgba(244,244,246,.55)', glow: 'rgba(0,0,0,.55)',
      ring: 'rgba(244,244,246,.35)',
      ch: {
        r: ['#FF6369', 'rgba(255,99,105,.20)'],
        g: ['#51CF66', 'rgba(81,207,102,.20)'],
        b: ['#4C9AFF', 'rgba(76,154,255,.20)']
      }
    }
  };
  window.setCameraTheme = function (dark) {
    var t = dark ? THEME.dark : THEME.light;
    var r = document.documentElement.style;
    r.setProperty('--fg', t.fg);
    r.setProperty('--mut', t.mut);
    r.setProperty('--faint', t.faint);
    r.setProperty('--line', t.line);
    r.setProperty('--tick', t.tick);
    r.setProperty('--knob-glow', t.glow);
    r.setProperty('--knob-ring', t.ring);
    CH.r.color = t.ch.r[0]; CH.r.soft = t.ch.r[1];
    CH.g.color = t.ch.g[0]; CH.g.soft = t.ch.g[1];
    CH.b.color = t.ch.b[0]; CH.b.soft = t.ch.b[1];
    sync();
  };

  sync();
  push();
  // 页面就绪告诉原生：好把当前主题推下来（早于就绪的切换由原生存着，就绪时补推）
  if (window.Native && Native.ready) {
    Native.ready();
  }
})();
</script>
</body>
</html>
